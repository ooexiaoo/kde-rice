"$schema" = 'https://starship.rs/config-schema.json'
scan_timeout = 60

# Icons: https://www.nerdfonts.com/cheat-sheet
# ░▒▓   ▓▒░   

# ////////////////////////////////////////////////
# FORMAT
# ////////////////////////////////////////////////

# Left
format = """
[░▒▓](color_black2)\
$os\
$time\
[](fg:color_black2 bg:color_green)\
$hostname\
$localip\
[](fg:color_green bg:color_blue2)\
$username\
[](fg:color_blue2 bg:color_yellow)\
$shell\
$shlvl\
$sudo\
[](fg:color_yellow bg:color_red)\
$git_branch\
$git_status\
$package\
$docker_context\
[](fg:color_red bg:color_purple)\
$directory\
[](fg:color_purple)\
$line_break\
$character\
[ ](fg:color_fg)
"""

# Right
right_format = """$cmd_duration"""

# Empty line
add_newline = true

# ////////////////////////////////////////////////
# COLORS
# ////////////////////////////////////////////////

palette = 'material_you'

# === material_you (auto-generated by starship-matyou.py) ===
[palettes.material_you]
color_fg = '#ffdde5'
color_bg = '#26000f'
color_red = '#f16558'
color_green = '#7be7a8'
color_yellow = '#bae083'
color_orange = '#e9a370'
color_purple = '#ff8791'
color_white1 = '#ffdde5'
color_white2 = '#ff8ea9'
color_white3 = '#ffc6cf'
color_black1 = '#26000f'
color_black2 = '#3b001a'
color_black3 = '#460021'
color_black4 = '#4d0025'
color_blue1 = '#2d6b65'
color_blue2 = '#58bfb7'
color_blue3 = '#93d1cb'
color_blue4 = '#baddda'
# === /material_you ===

# Nord: https://www.nordtheme.com
[palettes.arch_os]
color_fg = '#d8dee9'
color_bg = '#2e3440'
color_red = '#bf616a'
color_green = '#a3be8c'
color_purple = '#b48ead'
color_yellow = '#ebcb8b'
color_orange = '#d08770'
color_white1 = '#eceff4'
color_white2 = '#e5e9f0'
color_white3 = '#d8dee9'
color_black1 = '#2e3440'
color_black2 = '#3b4252'
color_black3 = '#434c5e'
color_black4 = '#4c566a'
color_blue1 = '#5e81ac'
color_blue2 = '#81a1c1'
color_blue3 = '#88c0d0'
color_blue4 = '#8fbcbb'

# EVA-01 Theme – Neon Genesis Evangelion inspired
# Purple armor + neon green accents + dark moody base
[palettes.eva01]
color_fg       = '#e0e0ff'     # Very pale purple-tinted white (readable text)
color_bg       = '#0f0e1a'     # Very dark purple-black (deep shadow/night feel)

color_red      = '#c62839'     # Blood/red accents (AT Field / damage)
color_green    = '#52d053'     # Classic EVA-01 neon green highlights
color_purple   = '#7e57c2'     # Mid EVA-01 purple (main armor tone)
color_yellow   = '#ffca28'     # Orange-yellow accents (chest/gorget glow)
color_orange   = '#f57c00'     # Stronger orange for details

color_white1   = '#f0f0ff'     # Almost white (bright highlights)
color_white2   = '#d0d0ff'     # Light purple-gray
color_white3   = '#b0a0ff'     # Muted light purple

color_black1   = '#0f0e1a'     # Deepest bg
color_black2   = '#1e1b2e'     # Dark purple-gray
color_black3   = '#2a2540'     # Mid-dark
color_black4   = '#3c3560'     # Darker purple tone

color_blue1    = '#303f9f'     # Deep blue-purple (shadow variant)
color_blue2    = '#5c6bc0'     # Mid blue-purple
color_blue3    = '#7986cb'     # Lighter blue-purple
color_blue4    = '#9fa8da'     # Pale blue-purple (subtle highlight)

# ////////////////////////////////////////////////
# LINE BREAK (disabled)
# ////////////////////////////////////////////////

[line_break]
disabled = true # Disabled

[character]
disabled = true # Disabled
success_symbol = '[ :](bold fg:color_green)'
error_symbol = '[ :](bold fg:color_red)'
vimcmd_symbol = '[  ](bold fg:color_green)'
vimcmd_replace_one_symbol = '[  ](bold fg:color_purple)'
vimcmd_replace_symbol = '[  ](bold fg:color_purple)'
vimcmd_visual_symbol = '[  ](bold fg:color_yellow)'

# ////////////////////////////////////////////////
# MODULES LEFT
# ////////////////////////////////////////////////

[os]
disabled = false
style = "fg:color_white3 bg:color_black2"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = ""
Ubuntu = ""
Debian = ""
Fedora = ""
Manjaro = ""
Pop = ""
Macos = ""
Windows = ""
Unknown = "❓"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:color_black2"
format = '[[  $time ](fg:color_green bg:color_black2)]($style)'

[hostname]
disabled = false
ssh_only = true
ssh_symbol =  " 󱘖 " # 󱘖    󰣀
style = "fg:color_bg bg:color_green"
format = '[$ssh_symbol]($style)[ 󰍹  $hostname ]($style)'

[localip]
disabled = false
ssh_only = true
style = "fg:color_bg bg:color_green"
format = '[ 󰩟 $localipv4 ]($style)'

[username]
disabled = false
show_always = false
style_user = "fg:color_bg bg:color_blue2"
style_root = "fg:color_red bg:color_blue2"
format = '[  ]($style)[ $user ](fg:color_bg bg:color_blue2)'

[shell]
disabled = false
fish_indicator = ""
bash_indicator = "   bash "
unknown_indicator = "   shell "
style = "fg:color_bg bg:color_yellow"
format = "[$indicator]($style)"

[shlvl]
disabled = false
threshold = 2
symbol = ''
style = "fg:color_bg bg:color_yellow"
format = "[ $symbol $shlvl ]($style)"

[sudo]
disabled = true
symbol = '󰌆 '
style = "fg:color_red bg:color_yellow"
format = '[ $symbol ]($style)'

[git_branch]
symbol = ""
style = "fg:color_on_accent bg:color_purple"
format = '[[ $symbol $branch ](fg:color_fg bg:color_red)]($style)'

[git_status]
style = "fg:color_on_accent_dim bg:color_purple"   # green status on purple bg
format = '[[($all_status$ahead_behind )](fg:color_fg bg:color_red)]($style)'

[package]
format = '[  $version ](fg:color_fg bg:color_red)'

[docker_context]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $context) ](fg:color_fg bg:color_red)]($style)'

[directory]
truncation_length = 6
truncation_symbol = "••/"
home_symbol = " "
read_only = "  "
read_only_style = "fg:color_red bg:color_purple"
style = "fg:color_on_accent bg:color_purple"
format = "[  ]($style)[$read_only]($read_only_style)[ $path ]($style)"

# ////////////////////////////////////////////////
# MODULES RIGHT
# ////////////////////////////////////////////////

[cmd_duration]
style = "fg:color_fg"
format = "[ ◄ $duration ]($style)"